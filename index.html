<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeviMC icon review</title>
<meta name="description" content="Compare the current levimc.org icons with the proposed replacements, one placement at a time.">
<meta name="theme-color" content="#f7f3e8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=2">
<script src="app.js?v=2" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">LEVI<b>ICON REVIEW</b></span>
    </div>

    <nav class="groups" id="groups" aria-label="Sections"></nav>

    <div class="tools">
      <div class="progress" title="Decisions made">
        <span id="progress-count">0 / 0</span>
        <span class="progress-bar" aria-hidden="true"><i id="progress-fill"></i></span>
      </div>
      <button class="btn ghost sm" id="summary-btn" type="button">Review</button>
      <button class="btn ghost sm icon" id="theme-btn" type="button" aria-pressed="false" title="Switch preview surface">
        <span id="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <main class="body">
    <aside class="rail" id="rail" aria-label="Placements"></aside>
    <section class="stage" id="stage" aria-live="polite"></section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <div>
        <p class="eyebrow">Decision sheet</p>
        <h2 id="sheet-title">What you picked</h2>
      </div>
      <button class="btn ghost sm" id="sheet-close" type="button">Close</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot">
      <p class="hint" id="sheet-hint"></p>
      <div class="sheet-actions">
        <button class="btn ghost sm" id="export-copy" type="button">Copy JSON</button>
        <button class="btn ghost sm" id="export-file" type="button">Download JSON</button>
        <button class="btn ghost sm danger" id="reset" type="button">Reset</button>
      </div>
    </footer>
  </div>
</div>
</body>
</html>
