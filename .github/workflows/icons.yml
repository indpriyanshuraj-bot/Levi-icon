name: Icons — optimise and release

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'data.json'
      - 'svgo.config.mjs'
      - 'scripts/manifest.mjs'
      - '.github/workflows/icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icons-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data.json
        run: node scripts/validate.mjs

      - name: Optimise SVGs
        run: |
          for dir in assets/*/; do
            name=$(basename "$dir")
            mkdir -p "dist/set/$name"
            npx --yes svgo@3 -f "$dir" -o "dist/set/$name" --config svgo.config.mjs
          done
          find dist/set -name '*.svg' | wc -l

      - name: Build manifest
        run: node scripts/manifest.mjs

      - name: Package
        run: |
          cd dist
          zip -qr levimc-icons.zip set manifest.json
          for dir in set/*/; do
            name=$(basename "$dir")
            [ -n "$(ls -A "$dir")" ] && zip -qr "${name}-icons.zip" "set/$name"
          done
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icons-v${{ github.run_number }}
          name: Icon set v${{ github.run_number }}
          make_latest: true
          body: |
            Optimised SVG set built from `${{ github.sha }}`.

            | Set | Download |
            | --- | --- |
            | Everything | [levimc-icons.zip](https://github.com/${{ github.repository }}/releases/latest/download/levimc-icons.zip) |
            | Website icons | [website-icons.zip](https://github.com/${{ github.repository }}/releases/latest/download/website-icons.zip) |
            | Levi project logos | [levi-icons.zip](https://github.com/${{ github.repository }}/releases/latest/download/levi-icons.zip) |
            | Miracle project logos | [miracle-icons.zip](https://github.com/${{ github.repository }}/releases/latest/download/miracle-icons.zip) |

            Single icon: `https://github.com/${{ github.repository }}/releases/latest/download/<name>.svg`.
            `manifest.json` lists every set, icon, palette and placement.
          files: |
            dist/levimc-icons.zip
            dist/*-icons.zip
            dist/manifest.json
            dist/set/*/*.svg
